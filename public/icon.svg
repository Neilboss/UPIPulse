<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1b3d"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Faint circuit lines -->
  <g stroke="#1e3a5f" stroke-width="2" opacity="0.4" fill="none">
    <line x1="60" y1="200" x2="160" y2="200"/><circle cx="160" cy="200" r="4" fill="#1e3a5f"/>
    <line x1="160" y1="200" x2="160" y2="140"/><circle cx="160" cy="140" r="4" fill="#1e3a5f"/>
    <line x1="350" y1="310" x2="450" y2="310"/><circle cx="350" cy="310" r="4" fill="#1e3a5f"/>
    <line x1="350" y1="310" x2="350" y2="370"/><circle cx="350" cy="370" r="4" fill="#1e3a5f"/>
    <line x1="80" y1="360" x2="140" y2="360"/><circle cx="80" cy="360" r="4" fill="#1e3a5f"/>
    <line x1="370" y1="150" x2="430" y2="150"/><circle cx="430" cy="150" r="4" fill="#1e3a5f"/>
    <line x1="430" y1="150" x2="430" y2="100"/><circle cx="430" cy="100" r="4" fill="#1e3a5f"/>
  </g>
  <!-- Rupee symbol ₹ -->
  <g filter="url(#glow)">
    <!-- Top bar -->
    <rect x="155" y="130" width="200" height="30" rx="8" fill="#e0f2fe"/>
    <!-- Second bar -->
    <rect x="155" y="175" width="160" height="28" rx="8" fill="#e0f2fe"/>
    <!-- Vertical stem -->
    <rect x="155" y="130" width="32" height="230" rx="8" fill="#e0f2fe"/>
    <!-- Diagonal leg -->
    <polygon points="187,260 355,360 330,360 165,260" fill="#e0f2fe"/>
  </g>
  <!-- Green lightning bolt slicing through -->
  <g filter="url(#glow)">
    <polygon points="290,110 230,275 268,275 210,400 340,220 295,220 355,110" fill="#10b981"/>
    <!-- Glow outline -->
    <polygon points="290,110 230,275 268,275 210,400 340,220 295,220 355,110"
             fill="none" stroke="#34d399" stroke-width="3" opacity="0.7"/>
  </g>
  <!-- UPI text -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="42" font-weight="bold"
        text-anchor="middle" fill="white" letter-spacing="6">UPI</text>
</svg>
